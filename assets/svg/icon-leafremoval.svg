<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Leaf removal icon">
  <!-- Leaf bag -->
  <path d="M12 20 Q10 40 14 44 L34 44 Q38 40 36 20 Z" fill="#D4A017"/>
  <!-- Bag opening -->
  <ellipse cx="24" cy="20" rx="12" ry="4" fill="#C49012"/>
  <!-- Bag tie -->
  <path d="M20 16 Q24 12 28 16" stroke="#C0392B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Falling leaves -->
  <path d="M8 10 Q12 6 14 10 Q12 14 8 10 Z" fill="#C0392B" opacity="0.8"/>
  <path d="M36 8 Q40 5 41 9 Q39 13 36 8 Z" fill="#D4A017" opacity="0.7"/>
  <path d="M30 4 Q33 1 35 5 Q33 8 30 4 Z" fill="#C49012" opacity="0.6"/>
  <!-- Leaf stems -->
  <line x1="11" y1="10" x2="14" y2="16" stroke="#C49012" stroke-width="1" opacity="0.6"/>
  <line x1="38" y1="9" x2="36" y2="16" stroke="#C49012" stroke-width="1" opacity="0.5"/>
  <!-- Bag fold line -->
  <path d="M16 28 Q24 26 32 28" stroke="#C49012" stroke-width="1" opacity="0.4"/>
</svg>
