<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-hidden="true">
  <!-- Folk-art embroidered flower (Tenango/Otomí inspired) -->
  <!-- Stem & leaves -->
  <g stroke="#386943" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M100 200 C 100 160, 96 130, 100 100"/>
  </g>
  <g fill="#4F8F5C">
    <path d="M100 168 C 78 162, 70 148, 76 134 C 92 138, 100 152, 100 168 Z"/>
    <path d="M100 148 C 122 144, 130 130, 124 116 C 108 120, 100 132, 100 148 Z"/>
  </g>

  <!-- Outer petals — magenta -->
  <g fill="#C7457E">
    <ellipse cx="100" cy="48"  rx="20" ry="32"/>
    <ellipse cx="100" cy="152" rx="20" ry="28" transform="rotate(180 100 100)"/>
    <ellipse cx="48"  cy="100" rx="32" ry="20"/>
    <ellipse cx="152" cy="100" rx="32" ry="20"/>
  </g>
  <!-- Inner petals — marigold -->
  <g fill="#E9A53B">
    <ellipse cx="100" cy="60"  rx="11" ry="22"/>
    <ellipse cx="100" cy="140" rx="11" ry="20"/>
    <ellipse cx="60"  cy="100" rx="22" ry="11"/>
    <ellipse cx="140" cy="100" rx="22" ry="11"/>
  </g>
  <!-- Diagonal accents — cobalt -->
  <g fill="#1F4E89">
    <circle cx="68"  cy="68"  r="9"/>
    <circle cx="132" cy="68"  r="9"/>
    <circle cx="68"  cy="132" r="9"/>
    <circle cx="132" cy="132" r="9"/>
  </g>
  <!-- Center -->
  <circle cx="100" cy="100" r="20" fill="#C44536"/>
  <circle cx="100" cy="100" r="10" fill="#FFF9E8"/>
  <circle cx="100" cy="100" r="4"  fill="#1F4E89"/>
</svg>
