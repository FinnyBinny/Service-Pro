<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 36" aria-hidden="true">
  <!-- Hand-drawn folk-art divider: terracotta + cobalt + marigold motif -->
  <g stroke="#C44536" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M2 18 L110 18"/>
    <path d="M210 18 L318 18"/>
  </g>

  <!-- Left vine -->
  <g fill="#4F8F5C">
    <ellipse cx="92" cy="14" rx="6" ry="3" transform="rotate(-25 92 14)"/>
    <ellipse cx="100" cy="22" rx="6" ry="3" transform="rotate(25 100 22)"/>
  </g>
  <!-- Right vine -->
  <g fill="#4F8F5C">
    <ellipse cx="220" cy="22" rx="6" ry="3" transform="rotate(-25 220 22)"/>
    <ellipse cx="228" cy="14" rx="6" ry="3" transform="rotate(25 228 14)"/>
  </g>

  <!-- Center floral medallion -->
  <g transform="translate(160 18)">
    <g fill="#E9A53B">
      <ellipse cx="0" cy="-12" rx="4" ry="7"/>
      <ellipse cx="0" cy="12"  rx="4" ry="7"/>
      <ellipse cx="-12" cy="0" rx="7" ry="4"/>
      <ellipse cx="12"  cy="0" rx="7" ry="4"/>
    </g>
    <g fill="#C7457E">
      <ellipse cx="-9" cy="-9" rx="5" ry="3" transform="rotate(-45)"/>
      <ellipse cx="9"  cy="-9" rx="5" ry="3" transform="rotate(45)"/>
      <ellipse cx="-9" cy="9"  rx="5" ry="3" transform="rotate(45)"/>
      <ellipse cx="9"  cy="9"  rx="5" ry="3" transform="rotate(-45)"/>
    </g>
    <circle cx="0" cy="0" r="5" fill="#1F4E89"/>
    <circle cx="0" cy="0" r="2" fill="#FBF4DF"/>
  </g>

  <!-- Mid dots (terracotta diamonds) -->
  <polygon points="120,18 124,12 128,18 124,24" fill="#C44536"/>
  <polygon points="192,18 196,12 200,18 196,24" fill="#C44536"/>
</svg>
