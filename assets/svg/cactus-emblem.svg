<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" aria-hidden="true">
  <!-- Folk-art saguaro cactus surrounded by marigold blooms — companion emblem to the rooster -->

  <!-- Soil base ellipse -->
  <ellipse cx="140" cy="298" rx="92" ry="10" fill="#5C4030" opacity="0.35"/>

  <!-- Cactus body (deep sage with cobalt outline like stained glass) -->
  <g stroke="#163A66" stroke-width="3" stroke-linejoin="round">
    <!-- Left arm -->
    <path d="M86,200 C 60,200 56,170 56,150 C 56,134 64,128 78,130 C 90,132 96,148 96,162 L 96,210 Z" fill="#4F8F5C"/>
    <!-- Right arm -->
    <path d="M194,180 C 220,180 224,150 224,128 C 224,112 216,106 202,108 C 190,110 184,126 184,140 L 184,200 Z" fill="#4F8F5C"/>
    <!-- Main trunk -->
    <path d="M104,290 C 100,260 100,200 102,140 C 104,84 122,60 140,60 C 158,60 176,84 178,140 C 180,200 180,260 176,290 Z" fill="#5A9D68"/>
  </g>

  <!-- Vertical ribs -->
  <g stroke="#163A66" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M122,90 L 122,280"/>
    <path d="M140,80 L 140,288"/>
    <path d="M158,90 L 158,280"/>
    <path d="M70,150 L 70,205"/>
    <path d="M85,140 L 85,210"/>
    <path d="M205,128 L 205,195"/>
    <path d="M218,135 L 218,180"/>
  </g>

  <!-- Spine dots -->
  <g fill="#FBF4DF">
    <circle cx="122" cy="120" r="1.6"/>
    <circle cx="122" cy="160" r="1.6"/>
    <circle cx="122" cy="200" r="1.6"/>
    <circle cx="122" cy="240" r="1.6"/>
    <circle cx="140" cy="110" r="1.6"/>
    <circle cx="140" cy="150" r="1.6"/>
    <circle cx="140" cy="190" r="1.6"/>
    <circle cx="140" cy="230" r="1.6"/>
    <circle cx="140" cy="270" r="1.6"/>
    <circle cx="158" cy="120" r="1.6"/>
    <circle cx="158" cy="160" r="1.6"/>
    <circle cx="158" cy="200" r="1.6"/>
    <circle cx="158" cy="240" r="1.6"/>
  </g>

  <!-- Crown blooms -->
  <g>
    <!-- Center marigold -->
    <g transform="translate(140 56)">
      <g fill="#E9A53B">
        <ellipse cx="0" cy="-12" rx="6" ry="10"/>
        <ellipse cx="0" cy="12"  rx="6" ry="10"/>
        <ellipse cx="-12" cy="0" rx="10" ry="6"/>
        <ellipse cx="12"  cy="0" rx="10" ry="6"/>
      </g>
      <g fill="#C44536">
        <ellipse cx="-9" cy="-9" rx="6" ry="4" transform="rotate(-45)"/>
        <ellipse cx="9"  cy="-9" rx="6" ry="4" transform="rotate(45)"/>
        <ellipse cx="-9" cy="9"  rx="6" ry="4" transform="rotate(45)"/>
        <ellipse cx="9"  cy="9"  rx="6" ry="4" transform="rotate(-45)"/>
      </g>
      <circle cx="0" cy="0" r="6" fill="#1F4E89"/>
    </g>
    <!-- Side blooms -->
    <g transform="translate(74 124)">
      <circle r="11" fill="#C7457E"/>
      <circle r="5" fill="#E9A53B"/>
    </g>
    <g transform="translate(212 104)">
      <circle r="11" fill="#C7457E"/>
      <circle r="5" fill="#E9A53B"/>
    </g>
  </g>
</svg>
