<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Fertilizing icon">
  <!-- Spray bottle body -->
  <rect x="16" y="18" width="18" height="24" rx="3" fill="#D4A017"/>
  <!-- Spray bottle top -->
  <rect x="20" y="12" width="10" height="8" rx="2" fill="#C49012"/>
  <!-- Nozzle -->
  <rect x="12" y="14" width="10" height="4" rx="2" fill="#D4A017"/>
  <!-- Trigger -->
  <path d="M14 18 Q12 22 14 24 L18 24" stroke="#C49012" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Spray drops -->
  <circle cx="8" cy="12" r="2" fill="#D4A017" opacity="0.7"/>
  <circle cx="5" cy="17" r="1.5" fill="#D4A017" opacity="0.5"/>
  <circle cx="9" cy="19" r="1.2" fill="#D4A017" opacity="0.4"/>
  <circle cx="4" cy="10" r="1" fill="#D4A017" opacity="0.3"/>
  <!-- Label line -->
  <rect x="19" y="24" width="12" height="2" rx="1" fill="#2C1A0E" opacity="0.4"/>
  <rect x="19" y="28" width="9" height="2" rx="1" fill="#2C1A0E" opacity="0.3"/>
</svg>
