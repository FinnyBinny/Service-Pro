<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Lawn mowing icon">
  <!-- Mower body -->
  <rect x="8" y="20" width="26" height="12" rx="3" fill="#D4A017"/>
  <!-- Mower top handle -->
  <path d="M28 20 L34 10 L38 10" stroke="#D4A017" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Blade housing -->
  <rect x="6" y="28" width="30" height="5" rx="2.5" fill="#C49012"/>
  <!-- Left wheel -->
  <circle cx="12" cy="36" r="5" fill="#2C1A0E" stroke="#D4A017" stroke-width="2"/>
  <!-- Right wheel -->
  <circle cx="30" cy="36" r="5" fill="#2C1A0E" stroke="#D4A017" stroke-width="2"/>
  <!-- Grass blades -->
  <path d="M2 33 Q4 26 6 33" stroke="#D4A017" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M38 33 Q40 25 42 33" stroke="#D4A017" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M41 33 Q43 28 45 33" stroke="#D4A017" stroke-width="1.5" fill="none" opacity="0.5"/>
